<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculator</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif; background:#f2f2f2; }
  .calc { width:300px; padding:16px; background:#fff; border-radius:16px; box-shadow:0 8px 30px rgba(0,0,0,.15); }
  #display { width:100%; box-sizing:border-box; height:64px; margin-bottom:12px; padding:0 12px; font-size:2rem; text-align:right; border:0; border-radius:8px; background:#eee; }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  button { height:52px; font-size:1.2rem; border:0; border-radius:8px; background:#e4e4e4; cursor:pointer; }
  button:active { filter:brightness(.9); }
  button.op { background:#ff9f0a; color:#fff; }
  button.eq { background:#30b94d; color:#fff; }
</style>
</head>
<body>
<div class="calc">
  <input id="display" value="0" readonly>
  <div class="keys" id="keys"></div>
</div>

<script>
// ===== Settings =====
const SECRET_CODE = "0000";          // type this, then press "="
const HIDDEN_PAGE = "games.html";    // page opened in the cloaked tab
const CLOAK_TITLE = "Google Docs";   // tab title for the cloaked tab
// ====================

const display = document.getElementById("display");
const keys = ["C","(",")","/","7","8","9","*","4","5","6","-","1","2","3","+","0",".","⌫","="];
let expr = "";

keys.forEach(k => {
  const b = document.createElement("button");
  b.textContent = k;
  if ("/*-+".includes(k)) b.className = "op";
  if (k === "=") b.className = "eq";
  b.onclick = () => press(k);
  document.getElementById("keys").appendChild(b);
});

function show() { display.value = expr || "0"; }

function press(k) {
  if (k === "C") expr = "";
  else if (k === "⌫") expr = expr.slice(0, -1);
  else if (k === "=") equals();
  else expr += k;
  show();
}

function equals() {
  if (expr === SECRET_CODE) { expr = ""; launchCloaked(); return; }
  if (!/^[0-9+\-*/().\s]+$/.test(expr)) { expr = ""; return; }
  try {
    const r = Function('"use strict"; return (' + expr + ')')();
    expr = Number.isFinite(r) ? String(+r.toFixed(10)) : "";
  } catch { expr = ""; }
}

document.addEventListener("keydown", e => {
  if (/^[0-9+\-*/().]$/.test(e.key)) press(e.key);
  else if (e.key === "Enter") press("=");
  else if (e.key === "Backspace") press("⌫");
  else if (e.key === "Escape") press("C");
});

function launchCloaked() {
  const win = window.open("about:blank", "_blank");
  if (!win) { alert("Please allow pop-ups for this page."); return; }
  const doc = win.document;
  doc.title = CLOAK_TITLE;
  doc.body.style.margin = "0";
  const frame = doc.createElement("iframe");
  frame.src = new URL(HIDDEN_PAGE, location.href).href;
  frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
  doc.body.appendChild(frame);
}
show();
</script>
</body>
</html>
