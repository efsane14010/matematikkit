<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#111; color:#eee; }
  header { padding:16px 24px; font-size:1.3rem; border-bottom:1px solid #333; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px; padding:24px; }
  .card { padding:24px 12px; text-align:center; background:#1e1e1e; border-radius:12px; cursor:pointer; }
  .card:hover { background:#2a2a2a; }
  #player { display:none; position:fixed; inset:0; background:#000; }
  #player iframe { width:100%; height:calc(100% - 44px); border:0; }
  #player button { height:44px; width:100%; border:0; background:#222; color:#eee; font-size:1rem; cursor:pointer; }
</style>
</head>
<body>
<header>Games</header>
<div id="grid"></div>
<div id="player"><button onclick="closeGame()">← Back</button><iframe id="frame" allowfullscreen></iframe></div>

<script>
// Add a game = add a line here, and put its files in the games/ folder.
const GAMES = [
  { name: "Snake (sample)", path: "games/snake/index.html" },
  { name: "Doom (shareware)", path: "games/doom/index.html" },
  { name: "Granny", path: "games/Granny/index.html" },
  // { name: "2048", path: "games/2048/index.html" },
  // { name: "Hextris", path: "games/hextris/index.html" },
];

const grid = document.getElementById("grid");
GAMES.forEach(g => {
  const d = document.createElement("div");
  d.className = "card"; d.textContent = g.name;
  d.onclick = () => openGame(g.path);
  grid.appendChild(d);
});
function openGame(p) { document.getElementById("frame").src = p; document.getElementById("player").style.display = "block"; }
function closeGame() { document.getElementById("frame").src = "about:blank"; document.getElementById("player").style.display = "none"; }
</script>
</body>
</html>
