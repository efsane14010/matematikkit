<!doctype html>
<html><head><meta charset="utf-8"><title>Snake</title>
<style>body{margin:0;background:#000;display:grid;place-items:center;height:100vh;color:#fff;font-family:sans-serif}canvas{background:#111;border:2px solid #333}</style></head>
<body><div><canvas id="c" width="400" height="400"></canvas><p id="s" style="text-align:center">Score: 0 — arrow keys</p></div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d"),N=20,S=20;
let snake,dir,food,score,alive,timer;
function reset(){snake=[{x:10,y:10}];dir={x:1,y:0};food={x:5,y:5};score=0;alive=true;clearInterval(timer);timer=setInterval(tick,110);}
function tick(){
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){alive=false;clearInterval(timer);document.getElementById("s").textContent="Game over ("+score+") — press Space";return;}
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};document.getElementById("s").textContent="Score: "+score;}else snake.pop();
  x.fillStyle="#111";x.fillRect(0,0,400,400);
  x.fillStyle="#e33";x.fillRect(food.x*S,food.y*S,S-2,S-2);
  x.fillStyle="#3c3";snake.forEach(p=>x.fillRect(p.x*S,p.y*S,S-2,S-2));
}
document.addEventListener("keydown",e=>{
  const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];
  if(m&&!(m[0]===-dir.x&&m[1]===-dir.y)){dir={x:m[0],y:m[1]};e.preventDefault();}
  if(e.key===" "&&!alive)reset();
});
reset();
</script></body></html>
