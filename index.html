<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hesap Makinesi | HesapKit</title>
<meta name="description" content="Ücretsiz online hesap makinesi. Toplama, çıkarma, çarpma, bölme ve parantezli işlemleri hızlıca yap. Eğlenceli oyunlar sayfamıza da göz at!">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1d1b3a; --muted:#6b6894; --pink:#ff5c93; --yellow:#ffd23f; --teal:#2ec4b6; --blue:#4d7cff; --purple:#7b4dff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; font-family:"Baloo 2",system-ui,sans-serif; color:var(--ink);
    background: radial-gradient(circle at 12% 8%, #ff9ad1 0, transparent 38%), radial-gradient(circle at 88% 12%, #ffe27a 0, transparent 34%),
                radial-gradient(circle at 80% 92%, #7be3d6 0, transparent 40%), linear-gradient(160deg,#8f6bff,#4d7cff 55%,#38c6ff); background-attachment:fixed; }
  header { text-align:center; padding:28px 16px 6px; }
  .logo { display:inline-flex; align-items:center; gap:12px; font-size:clamp(2rem,6vw,3rem); font-weight:800; color:#fff; text-shadow:0 4px 0 rgba(29,27,58,.25); }
  .logo .dot { display:inline-grid; place-items:center; width:1.2em; height:1.2em; border-radius:30%; background:var(--yellow); box-shadow:0 4px 0 rgba(29,27,58,.25); transform:rotate(-8deg); font-size:.9em; }
  .nav { display:flex; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  .nav a { color:#fff; text-decoration:none; font-weight:700; padding:8px 18px; border-radius:999px; background:rgba(255,255,255,.22); }
  .nav a.on { background:var(--yellow); color:var(--ink); box-shadow:0 4px 0 rgba(29,27,58,.25); }
  .ad { max-width:970px; margin:16px auto 0; text-align:center; padding:0 12px; }
  .ad:empty { display:none; }
  main { display:grid; place-items:center; padding:18px 12px 30px; }
  .calc { width:320px; max-width:100%; padding:16px; background:#fff; border-radius:28px; box-shadow:0 10px 0 rgba(29,27,58,.2); }
  #display { width:100%; height:70px; margin-bottom:12px; padding:0 16px; font:800 2.2rem "Baloo 2",sans-serif; text-align:right; border:0; border-radius:18px; background:#f1eeff; color:var(--ink); }
  .keys { display:grid; grid-template-columns:repeat(4,1fr); gap:9px; }
  button.k { height:56px; font:800 1.3rem "Baloo 2",sans-serif; border:0; border-radius:16px; background:#ece8ff; color:var(--ink); cursor:pointer; box-shadow:0 4px 0 rgba(29,27,58,.15); }
  button.k:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(29,27,58,.15); }
  button.k.op { background:var(--blue); color:#fff; }
  button.k.fn { background:var(--yellow); }
  button.k.eq { background:var(--pink); color:#fff; }
  .about { max-width:640px; margin:0 auto; padding:0 20px 40px; color:#fff; text-align:center; font-weight:500; }
  .about h2 { margin:0 0 6px; text-shadow:0 3px 0 rgba(29,27,58,.2); }
  .cta { display:inline-block; margin-top:10px; background:var(--yellow); color:var(--ink); font-weight:800; text-decoration:none; padding:10px 22px; border-radius:999px; box-shadow:0 5px 0 rgba(29,27,58,.25); }
  footer { text-align:center; color:#fff; opacity:.85; padding:0 12px 24px; font-size:.9rem; }
</style>
</head>
<body>
<header>
  <div class="logo"><span class="dot">🧮</span> HesapKit</div>
</header>

<div class="ad" id="adTop"><!-- REKLAM KODU BURAYA (ör. AdSense) --></div>

<main>
  <div class="calc">
    <input id="display" value="0" readonly aria-label="Ekran">
    <div class="keys" id="keys"></div>
  </div>
</main>

<div class="ad" id="adBottom"><!-- REKLAM KODU BURAYA --></div>

<section class="about">
  <h2>Ücretsiz Online Hesap Makinesi</h2>
  <p>Toplama, çıkarma, çarpma, bölme ve parantezli işlemleri saniyeler içinde yap. Klavyeyi de kullanabilirsin.</p>
</section>
<footer>© HesapKit</footer>

<script>
// ===== Ayarlar =====
const SECRET_CODE = "00000";        // bunu yaz, sonra "=" ye bas
const HIDDEN_PAGE = "games.html";   // gizli sekmede açılacak sayfa
const CLOAK_TITLE = "Oyunlar";      // sekme başlığı
// ===================

const display = document.getElementById("display");
const keys = ["C","(",")","/","7","8","9","*","4","5","6","-","1","2","3","+","0",".","⌫","="];
const label = { "/":"÷", "*":"×", "-":"−" };
let expr = "";

keys.forEach(k => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = label[k] || k;
  b.className = "k" + ("/*-+".includes(k) ? " op" : k === "=" ? " eq" : ("C⌫".includes(k) ? " fn" : ""));
  b.onclick = () => press(k);
  document.getElementById("keys").appendChild(b);
});

function show() { display.value = (expr || "0").replace(/\*/g,"×").replace(/\//g,"÷"); }
function press(k) {
  if (k === "C") expr = "";
  else if (k === "⌫") expr = expr.slice(0, -1);
  else if (k === "=") equals();
  else expr += k;
  show();
}
function equals() {
  if (expr === SECRET_CODE) { expr = ""; launchCloaked(); return; }
  if (!/^[0-9+\-*/().\s]+$/.test(expr)) { expr = ""; return; }
  try {
    const r = Function('"use strict"; return (' + expr + ')')();
    expr = Number.isFinite(r) ? String(+r.toFixed(10)) : "";
  } catch { expr = ""; }
}
document.addEventListener("keydown", e => {
  if (/^[0-9+\-*/().]$/.test(e.key)) press(e.key);
  else if (e.key === "Enter") press("=");
  else if (e.key === "Backspace") press("⌫");
  else if (e.key === "Escape") press("C");
});
function launchCloaked() {
  const win = window.open("about:blank", "_blank");
  if (!win) { alert("Lütfen bu sayfa için açılır pencerelere izin ver."); return; }
  const doc = win.document;
  doc.title = CLOAK_TITLE;
  doc.body.style.margin = "0";
  const frame = doc.createElement("iframe");
  frame.src = new URL(HIDDEN_PAGE, location.href).href;
  frame.allow = "fullscreen; autoplay; gamepad";
  frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0";
  doc.body.appendChild(frame);
}
show();
</script>
</body>
</html>
