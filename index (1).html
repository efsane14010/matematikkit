<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doom</title>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
<style>
  html, body { margin:0; height:100%; background:#000; }
  #dos { width:100%; height:100%; }
  #missing { display:none; color:#eee; font-family:system-ui,sans-serif; padding:24px; max-width:560px; margin:auto; }
</style>
</head>
<body>
<div id="dos"></div>
<div id="missing">
  <h2>Doom bundle not found</h2>
  <p>Put the shareware Doom bundle in this folder as <code>doom.jsdos</code>
     (download it from dos.zone, search "Doom shareware"), then reload.</p>
</div>
<script>
// ===== Settings =====
const BUNDLE = "doom.jsdos";   // shareware Doom packaged for js-dos
// ====================

fetch(BUNDLE, { method: "HEAD" })
  .then(r => {
    if (!r.ok) throw new Error("missing");
    Dos(document.getElementById("dos"), { url: BUNDLE });
  })
  .catch(() => {
    document.getElementById("dos").style.display = "none";
    document.getElementById("missing").style.display = "block";
  });
</script>
</body>
</html>
